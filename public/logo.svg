<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Card mark -->
  <rect x="1" y="1" width="38" height="46" rx="7" fill="#0a0a0f" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="7" y="16" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#00d4aa">A</text>
  <text x="19" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#00d4aa">♠</text>
  <g transform="rotate(180, 19, 24)">
    <text x="7" y="16" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#00d4aa">A</text>
  </g>

  <!-- Wordmark -->
  <text x="52" y="31" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="22" font-weight="800" letter-spacing="-1" fill="#e8eaf0">AS</text>
  <text x="83" y="31" font-family="'Courier New', 'SF Mono', 'Consolas', monospace" font-size="17" font-weight="400" letter-spacing="0.5" fill="#00d4aa">Code</text>
</svg>
